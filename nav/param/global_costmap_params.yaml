global_costmap:
  global_frame: map #地图坐标系
  robot_base_frame: base_footprint #机器人坐标系
  # 以此实现坐标变换

  update_frequency: 10.0 #代价地图更新频率
  publish_frequency: 10.0 #代价地图的发布频率
  transform_tolerance: 0.5 #等待坐标变换发布信息的超时时间

  static_map: true # 是否使用一个地图或者地图服务器来初始化全局代价地图，如果不使用静态地图，这个参数为false.
  track_unknown_space: true # 是否将未知区域（未知的代价）视为障碍物
  publish_obstacles_topic: true # 是否发布障碍物信息
  publish_static_map: true # 是否发布静态地图
  
  rolling_window: false # 是否使用滚动窗口
  rolling_window_size: 2.0 # 滚动窗口的大小
  rolling_window_update_rate: 0.4 # 滚动窗口的更新频率
  rolling_window_padding: 0.2 # 滚动窗口的填充
  rolling_window_min_obstacle_height: 0.0 # 滚动窗口的最小障碍物高度
  rolling_window_max_obstacle_height: 0.0 # 滚动窗口的最大障碍物高度

  width: 50.0 # 代价地图的宽度
  height: 50.0 # 代价地图的高度
  resolution: 0.05 # 代价地图的分辨率
  origin_x: -25.0 # 代价地图的x坐标原点
  origin_y: -25.0 # 代价地图的y坐标原点
  

  #膨胀半径，扩展在碰撞区域以外的代价区域，使得机器人规划路径避开障碍物
  inflation_radius: 0.4